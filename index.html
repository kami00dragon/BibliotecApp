<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BibliotecApp - Ultimate Wood Edition</title>
    <!-- Librerías para generación de PDF e Imágenes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* =========================================
           1. CSS BIBLIOTECA
           ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            min-height: 100vh;
            background: linear-gradient(to bottom, #fef3c7, #fcd34d);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        header {
            background: linear-gradient(to bottom, #451a03, #78350f, #451a03);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            padding: 2rem 1rem 1rem 1rem;
            position: relative;
            width: 100%;
            z-index: 10;
            border-bottom: 4px solid #281a16;
            min-height: 80px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .header-content { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .header-title { width: 100%; margin-bottom: 0.5rem; display: flex; align-items: flex-end; justify-content: space-between; }
        .header-title h1 {
            font-size: 2.5rem; font-weight: 900; font-family: 'Georgia', serif, sans-serif;
            color: #fcd34d; letter-spacing: 2px; margin: 0; text-align: center; width: 100%;
            text-shadow: 2px 2px 0px #281a16;
        }
        .center-wrapper {
            max-width: 600px; width: 100%; text-align: center; position: absolute;
            bottom: 0; left: 25rem; z-index: 5; display: flex; flex-direction: column; align-items: center;
        }
        .center-wrapper h1 { margin-bottom: 3.75rem; }
        .header-with-guardians { display: flex; align-items: flex-end; justify-content: space-between; width: 100%; flex-wrap: wrap; position: relative; }
        .guardians-left-group { display: flex; align-items: flex-end; gap: 0; position: relative; z-index: 2; }
        .guardians-container { display: flex; align-items: flex-end; gap: 0; position: relative; z-index: 2; }
        .guardian-statue { width: 7.5rem; height: 10.5rem; filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.4)); }
        .guardian-shisa { width: 9rem; height: 10.5rem; filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.4)); }
        @media (min-width: 768px) {
            .guardian-statue { width: 9rem; height: 12rem; }
            .guardian-shisa { width: 11rem; height: 12rem; }
        }
        @media (max-width: 900px) {
            .center-wrapper { position: static; left: auto; bottom: auto; margin-top: 1rem; margin-left: auto; margin-right: auto; }
            .center-wrapper h1 { margin-bottom: 0.5rem; }
            .header-with-guardians { flex-direction: column; align-items: center; gap: 0.5rem; }
            .guardians-left-group, .guardians-container { margin-bottom: 0.5rem; }
        }
        @media (max-width: 480px) {
            .guardian-statue { width: 6rem; height: 8.4rem; }
            .guardian-shisa { width: 7.2rem; height: 8.4rem; }
        }
        .search-filters { display: flex; flex-direction: column; gap: 0.75rem; align-items: center; width: 100%; }
        .search-with-stars { display: flex; align-items: center; gap: 0.75rem; width: 100%; margin: 0 auto; }
        .search-star { width: 2.5rem; height: 2.5rem; filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3)); flex-shrink: 0; }
        .search-input {
            padding: 0.75rem 1rem; border-radius: 0.5rem; border: 2px solid #f59e0b;
            background: white; color: #78350f; font-size: 1rem; width: 100%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .search-input:focus { outline: none; border-color: #f59e0b; }
        .search-input::placeholder { color: #b45309; }
        .filter-label { display: flex; align-items: center; gap: 0.5rem; color: #fef3c7; cursor: pointer; font-size: 1rem; }
        .filter-checkbox { width: 1.25rem; height: 1.25rem; accent-color: #f59e0b; cursor: pointer; }
        main { flex: 1; max-width: 1400px; margin: 0 auto; padding: 2rem 1rem; width: 100%; position: relative; }
        .library-frame { position: relative; background: linear-gradient(to bottom, #78350f, #451a03); border-radius: 1rem; padding: 1rem; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); width: 100%; border: 2px solid #4e342e; }
        .library-inner { position: relative; background: linear-gradient(to bottom, #5d4037, #4e342e); border-radius: 0.75rem; padding: 1.5rem; box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.2); width: 100%; border: 1px solid #3e2723; }
        .library-molding { position: absolute; left: 0; right: 0; height: 1rem; background: linear-gradient(to bottom, #6d4c41, #5d4037); }
        .library-molding.top { top: 0; border-radius: 0.75rem 0.75rem 0 0; }
        .library-molding.bottom { bottom: 0; border-radius: 0 0 0.75rem 0.75rem; }
        .bookshelf { margin-bottom: 1.5rem; }
        .bookshelf-bg { background: transparent; border-radius: 0.5rem; padding: 1.5rem; min-height: 200px; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3); position: relative; overflow: hidden; }
        .books-container { display: flex; align-items: flex-end; justify-content: center; gap: 0.25rem; min-height: 160px; padding-bottom: 0.75rem; flex-wrap: wrap; }
        .books-container.align-left { justify-content: flex-start; padding-left: 0.5rem; }
        .books-container.align-right { justify-content: flex-end; padding-right: 0.5rem; }
        .shelf-board { height: 1.5rem; background: linear-gradient(to bottom, #6d4c41, #4e342e); border-radius: 0.125rem; box-shadow: 0 6px 10px rgba(0, 0, 0, 0.6); border-top: 1px solid rgba(255,255,255,0.1); position: relative; z-index: 1; }
        .book {
            position: relative; width: 2.5rem; height: 10rem; border-radius: 0.125rem; background: #8B4513;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4), inset 1px 1px 2px rgba(255, 255, 255, 0.1);
            transform: translateY(0); transition: all 0.3s ease; cursor: pointer; overflow: hidden; border: none; z-index: 5;
        }
        .book:hover { transform: translateY(-4px) scale(1.05); box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.5); }
        .book-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 0.5rem; background: rgba(0, 0, 0, 0.2); }
        .book-texture { position: absolute; inset: 0; background: linear-gradient(to right, rgba(0, 0, 0, 0.3), transparent); }
        .book-decoration { position: absolute; left: 0.125rem; top: 0.5rem; bottom: 0.5rem; display: flex; flex-direction: column; justify-content: space-between; }
        .book-line { width: 0.25rem; height: 0.125rem; background: rgba(255, 255, 255, 0.2); }
        .book-label { position: absolute; right: 0.25rem; top: 50%; transform: translateY(-50%); width: 1.25rem; }
        .book-label-text { font-size: 0.5rem; color: rgba(255, 255, 255, 0.8); font-weight: bold; line-height: 1.2; }
        .book-label-author { font-size: 0.4rem; color: rgba(255, 255, 255, 0.6); margin-top: 0.125rem; }
        .special-book {
            position: relative; width: 4rem; height: 10rem; border-radius: 0.125rem; background: #8B4513;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4), inset 1px 1px 2px rgba(255, 255, 255, 0.1);
            transform: translateY(0); transition: all 0.3s ease; cursor: pointer; overflow: visible; text-decoration: none; display: block; z-index: 5;
        }
        .special-book:hover { transform: translateY(-4px) scale(1.05); box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.5); }
        .special-book-texture { position: absolute; inset: 0; background: linear-gradient(to right, rgba(0, 0, 0, 0.3), transparent); }
        .special-book-decoration { position: absolute; left: 0.25rem; top: 0.5rem; bottom: 0.5rem; display: flex; flex-direction: column; justify-content: space-between; }
        .special-book-line { width: 0.25rem; height: 0.125rem; background: rgba(255, 255, 255, 0.2); }
        .special-book-label {
            position: absolute; right: 0.5rem; top: 15%; transform: rotate(-180deg); font-size: 0.75rem; color: white;
            font-weight: bold; letter-spacing: 0.1em; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8); line-height: 1.2; writing-mode: vertical-rl; text-orientation: mixed; height: 70%; overflow: hidden;
        }
        .butterfly { position: absolute; top: 10px; right: -5px; width: 24px; height: 20px; z-index: 20; pointer-events: none; }
        .butterfly-wing { position: absolute; top: 0; width: 12px; height: 18px; background: rgba(147, 51, 234, 0.7); border-radius: 50% 50% 0 50%; animation: flutter 0.15s infinite alternate; }
        .butterfly.blue .butterfly-wing { background: rgba(59, 130, 246, 0.7); }
        .butterfly.yellow .butterfly-wing { background: rgba(234, 179, 8, 0.7); }
        .butterfly-wing.left { left: 0; transform-origin: right center; }
        .butterfly-wing.right { right: 0; transform-origin: left center; transform: scaleX(-1); }
        @keyframes flutter { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(60deg); } }
        .ladybug-container { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 16px; height: 14px; z-index: 20; transform-style: preserve-3d; perspective: 50px; }
        .ladybug-head { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 10px; height: 5px; background: black; border-radius: 5px; z-index: 30; }
        .ladybug-wing-under { position: absolute; top: 2px; bottom: 2px; width: 40%; background: rgba(0, 0, 0, 0.5); border-radius: 50%; z-index: 10; animation: flutterWings 0.1s infinite alternate; }
        .ladybug-wing-under.left { left: 10%; transform-origin: right center; }
        .ladybug-wing-under.right { right: 10%; transform-origin: left center; }
        @keyframes flutterWings { 0% { transform: rotateY(-10deg); } 100% { transform: rotateY(10deg); } }
        .ladybug-shell { position: absolute; top: 0; bottom: 0; width: 50%; background: radial-gradient(circle at 30% 30%, #ef4444, #b91c1c); z-index: 20; animation: openShell 1.5s infinite ease-in-out alternate; }
        .ladybug-shell.left { left: 0; border-radius: 8px 0 0 0; transform-origin: right center; }
        .ladybug-shell.right { right: 0; border-radius: 0 8px 0 0; transform-origin: left center; }
        .ladybug-spot-shell { position: absolute; width: 2px; height: 2px; background: black; border-radius: 50%; }
        .ls-1 { top: 2px; right: 2px; } .ls-2 { top: 5px; right: 4px; } .ls-3 { top: 2px; left: 2px; } .ls-4 { top: 5px; left: 4px; }
        @keyframes openShell { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(-70deg); } }
        .ladybug-walking { position: absolute; width: 8px; height: 8px; background: radial-gradient(circle at 30% 30%, #ef4444, #b91c1c); border-radius: 50%; z-index: 4; box-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .ladybug-walking::before { content: ''; position: absolute; top: -2px; left: 1px; width: 5px; height: 3px; background: black; border-radius: 50%; }
        .ladybug-walking::after { content: ''; position: absolute; top: 0; left: 50%; height: 100%; width: 1px; background: black; }
        .ladybug-walking .spot { position: absolute; width: 1.5px; height: 1.5px; background: black; border-radius: 50%; }
        .lw-s1 { top: 1px; left: 1px; } .lw-s2 { top: 5px; left: 1px; } .lw-s3 { top: 1px; right: 1px; } .lw-s4 { top: 5px; right: 1px; }
        .ladybug-walking-legs { position: absolute; bottom: -1px; left: -1px; width: 10px; height: 2px; background: transparent; }
        .ladybug-walking-legs::before, .ladybug-walking-legs::after { content: ''; position: absolute; width: 3px; height: 2px; background: black; border-radius: 2px; }
        .ladybug-walking-legs::before { left: 1px; animation: leg-move 0.2s infinite; }
        .ladybug-walking-legs::after { right: 1px; animation: leg-move 0.2s infinite reverse; }
        @keyframes leg-move { 0% { transform: rotate(0deg); } 100% { transform: rotate(20deg); } }
        
        /* Cat CSS */
        .cat-container { position: fixed; left: -300px; bottom: 2rem; width: 150px; height: 110px; z-index: 1000; pointer-events: auto; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3)); will-change: transform, left; cursor: pointer; }
        .cat-container.small-cat { width: 120px; height: 88px; }
        .facing-left { transform: scaleX(-1); } .facing-right { transform: scaleX(1); }
        .cat-svg { width: 100%; height: 100%; overflow: visible; }
        .cat-body { fill: #fffbf0; } .cat-head { fill: #fffbf0; }
        .patch-black { fill: #2c3e50; } .patch-orange { fill: #e67e22; }
        .cat-eye { fill: #f1c40f; stroke: #2c3e50; stroke-width: 1; }
        .cat-pupil { fill: #000; transform-box: fill-box; transform-origin: center; }
        .eyelid { fill: #2c3e50; opacity: 0; transform-box: fill-box; transform-origin: center; }
        .cat-nose { fill: pink; }
        .cat-tail { fill: none; stroke: #2c3e50; stroke-width: 8; stroke-linecap: round; }
        .cat-paw { fill: #fffbf0; stroke: #e0e0e0; stroke-width: 1; transform-origin: top center; }
        @keyframes blinkAnim { 0%, 94%, 100% { opacity: 0; transform: scaleY(1); } 97% { opacity: 1; transform: scaleY(0.1); } }
        .cat-eye .eyelid { animation: blinkAnim 5s infinite; }
        .cat-paw.swiping { animation: swipeAnim 0.2s ease-out; }
        @keyframes swipeAnim { 0% { transform: rotate(0deg); } 50% { transform: rotate(-45deg) translateX(-10px); } 100% { transform: rotate(0deg); } }
        /* Fox CSS */
        .baby-fox { position: fixed; width: 130px; height: 95px; z-index: 1001; pointer-events: none; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3)); }
        .fox-fur-main { fill: #E65100; } .fox-fur-light { fill: #FFF3E0; } .fox-fur-dark { fill: #BF360C; } .fox-nose { fill: #3E2723; }
        .fox-eye-closed { fill: none; stroke: #3E2723; stroke-width: 2; stroke-linecap: round; }

        /* Modal Info Original */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; z-index: 2000; padding: 1rem; }
        .modal.active { display: flex; }
        .modal-content { background: linear-gradient(to bottom right, #fef9c3, #fef3c7); border-radius: 0.5rem; max-width: 32rem; width: 100%; padding: 1.5rem; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); border: 4px solid #78350f; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 1rem; }
        .modal-title { font-size: 1.5rem; font-weight: bold; color: #78350f; flex: 1; }
        .modal-close { background: none; border: none; color: #78350f; font-size: 2rem; cursor: pointer; padding: 0; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { color: #dc2626; }
        .modal-info { margin-bottom: 1.5rem; }
        .modal-info p { color: #92400e; margin-bottom: 0.5rem; font-size: 1rem; }
        .modal-info strong { font-weight: bold; }
        .modal-status-available { color: #16a34a; font-weight: bold; }
        .modal-status-unavailable { color: #dc2626; font-weight: bold; }
        
        .read-pdf-btn { display: flex; align-items: center; justify-content: center; gap: 0.5rem; background: linear-gradient(to right, #dc2626, #b91c1c); color: white; padding: 1rem 1.5rem; border-radius: 0.5rem; font-weight: bold; text-decoration: none; margin-top: 1rem; transition: all 0.2s ease; cursor: pointer; border: none; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .read-pdf-btn:hover { background: linear-gradient(to right, #b91c1c, #991b1b); transform: scale(1.02); }
        
        /* Nuevo Botón de Video */
        .watch-video-btn {
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            background: linear-gradient(to right, #16a34a, #15803d); color: white; padding: 1rem 1.5rem; border-radius: 0.5rem;
            font-weight: bold; text-decoration: none; margin-top: 1rem; transition: all 0.2s ease; cursor: pointer; border: none; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .watch-video-btn:hover { background: linear-gradient(to right, #15803d, #166534); transform: scale(1.02); }

        .no-pdf-message { background: #fef3c7; border: 2px solid #f59e0b; border-radius: 0.5rem; padding: 1rem; text-align: center; }
        .no-pdf-message p { color: #78350f; font-weight: bold; margin-bottom: 0.5rem; }
        .no-pdf-message small { color: #b45309; }
        .no-results { text-align: center; padding: 3rem 1rem; }
        .no-results h2 { font-size: 1.5rem; color: #fcd34d; margin-bottom: 0.5rem; }
        .no-results p { color: #fef3c7; }
        footer { background: linear-gradient(to right, #78350f, #92400e, #78350f); box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.3); padding: 1.5rem; margin-top: auto; margin-bottom: 50px; }
        .footer-content { max-width: 1400px; margin: 0 auto; text-align: center; }
        .footer-content p { color: #fef3c7; margin-bottom: 0.5rem; }
        .footer-content small { color: #fcd34d; font-size: 0.875rem; }
        @media (max-width: 640px) {
            .book { width: 1.8rem; height: 7rem; }
            .books-container { gap: 0.125rem; min-height: 110px; }
            .special-book { width: 3rem; height: 7rem; }
            .special-book-label { font-size: 0.75rem; top: 10%; }
            .bookshelf-bg { padding: 1rem; min-height: 140px; }
            .shelf-board { height: 1rem; }
            .header-title h1 { font-size: 1.2rem; }
            .modal-content { padding: 1rem; }
            .modal-title { font-size: 1.25rem; }
            .butterfly { width: 16px; height: 14px; }
            .ladybug-container { width: 12px; height: 10px; }
        }
        @media (max-width: 768px) { header { padding: 1.5rem 1rem 0.5rem 1rem; } }

        /* =========================================
           2. CSS DEL LECTOR MATERIAL (ESTILO MADERA FINAL)
           ========================================= */
        .reader-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            z-index: 3000;
            flex-direction: column;
        }
        .reader-modal.active { display: flex; }

        /* TEXTURA DE MADERA IGUAL QUE BIBLIOTECA */
        .wood-panel {
            background: linear-gradient(to bottom, #451a03, #78350f, #451a03);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            border-bottom: 4px solid #281a16;
            border-top: 1px solid #5d4037;
            position: relative;
            z-index: 100;
        }
        .wood-panel::after {
            content: "";
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.03) 1px, transparent 2px, transparent 10px);
            pointer-events: none;
        }

        /* Barra de herramientas "Madera" */
        .reader-toolbar {
            height: auto; min-height: 80px;
            padding: 0.75rem 1rem;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            color: #fcd34d;
            flex-shrink: 0;
        }

        .reader-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; }
        .tool-group { display: flex; align-items: center; gap: 5px; padding-right: 10px; margin-right: 10px; border-right: 1px solid rgba(40, 26, 22, 0.5); flex-wrap: wrap; }
        .tool-group:last-child { border: none; }
        
        /* Campo de búsqueda PDF nuevo */
        .pdf-search-wrapper {
            display: flex; align-items: center; gap: 5px;
            background: rgba(255,255,255,0.9);
            border: 2px solid #281a16;
            border-radius: 4px;
            padding: 0 5px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .pdf-search-input {
            border: none; background: transparent; padding: 6px;
            font-family: 'Georgia', serif; color: #3E2723; width: 120px; font-size: 0.9rem; outline: none;
        }
        .pdf-search-input::placeholder { color: #8D6E63; font-style: italic; font-size: 0.8rem; }

        .tool-btn {
            background: #5d4037; border: 2px solid #281a16; color: #fcd34d;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem;
            font-family: 'Georgia', serif; font-weight: bold;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; min-width: 40px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .tool-btn:hover { background: #6d4c41; transform: translateY(-1px); box-shadow: 0 4px 6px rgba(0,0,0,0.5); border-color: #fcd34d; }
        .tool-btn.active { background: #fcd34d; color: #3E2723; border-color: #fff; box-shadow: 0 0 10px rgba(252, 211, 93, 0.6); text-shadow: none; }
        
        /* Botones de acción */
        .tool-btn.action-btn {
            background: #281a16; color: #fcd34d; border-color: #5d4037;
            font-size: 0.8rem; padding: 6px 10px;
        }
        .tool-btn.action-btn:hover { background: #3e2723; border-color: #fcd34d; }

        .tool-settings { display: none; align-items: center; gap: 10px; padding: 5px 10px; background: rgba(40, 26, 22, 0.4); border-radius: 4px; border: 1px solid #5d4037; }
        .tool-settings.show { display: flex; }
        input[type="color"] { width: 30px; height: 30px; border: 1px solid #fff; padding: 0; background: none; cursor: pointer; border-radius: 3px;}
        input[type="range"] { width: 80px; accent-color: #fcd34d; cursor: pointer; }

        .close-reader-btn {
            background: #b71c1c; border: 2px solid #5d4037; color: white; font-weight: bold;
            padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.9rem;
            font-family: 'Georgia', serif;
            box-shadow: 0 3px 5px rgba(0,0,0,0.4);
        }
        .close-reader-btn:hover { background: #c62828; transform: scale(1.05); }

        /* Área de lectura (El Papel) */
        .reader-desk {
            flex: 1;
            position: relative;
            background-color: #1a1a1a;
            /* IMPORTANTE: El scroll ocurre aquí */
            overflow-y: auto;
            display: flex;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle, #2d1b15, #1a0f0a);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
            min-height: 0;
        }

        .reader-desk.mode-draw { cursor: crosshair; }

        /* Contenedor principal del papel */
        .paper-sheet {
            position: relative;
            background: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 900px;
            /* Altura fija grande para simular documento largo */
            height: 5000px; 
            transform-origin: center center;
            transition: transform 0.2s ease;
            border: 1px solid #ccc;
            flex-shrink: 0; 
        }

        /* Capas superpuestas */
        .paper-texture {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            pointer-events: none; z-index: 5; opacity: 0.4; mix-blend-mode: multiply;
        }

        /* ESTILOS CRÍTICOS PARA EL SCROLL SINCRONIZADO */
        #pdf-iframe {
            width: 100%; height: 100%; border: none;
            position: absolute; top: 0; left: 0; z-index: 1;
            background: white;
            /* FORZAR QUE NO TENGA SCROLL INTERNO */
            overflow: hidden !important; 
            pointer-events: auto; 
        }

        #drawing-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; 
        }
        
        /* En modo dibujo, el canvas captura eventos, el iframe queda pasivo */
        .reader-desk.mode-draw #drawing-layer { pointer-events: auto; }
        .reader-desk.mode-draw #pdf-iframe { pointer-events: none; }


        /* Footer de Herramientas de Texto (Madera) */
        .reader-footer-panel {
            height: 70px; 
            background: linear-gradient(to bottom, #451a03, #78350f, #451a03);
            border-top: 4px solid #5d4037;
            display: flex; flex-direction: column; padding: 0 20px; color: white; flex-shrink: 0; z-index: 20;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.8);
            transition: height 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), padding 0.4s ease;
            overflow: hidden;
            position: relative;
        }
        
        .reader-footer-panel.expanded {
            height: calc(100vh - 85px); 
            padding: 20px;
        }

        .reader-footer-header {
            height: 70px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: absolute;
            top: 0; left: 0;
            z-index: 30;
            background: linear-gradient(to bottom, #4e342e, #3e2723);
            border-bottom: 1px solid #5d4037;
        }

        .reader-footer-header:hover { background: linear-gradient(to bottom, #5d4037, #4e342e); }

        .reader-footer-content {
            margin-top: 70px; 
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease 0.1s;
            pointer-events: none; 
        }

        .reader-footer-panel.expanded .reader-footer-content {
            opacity: 1;
            pointer-events: auto;
        }

        .reader-textarea {
            flex: 1; background: #1a1a1a; border: 2px solid #fcd34d; color: #fcd34d;
            padding: 15px; border-radius: 4px; font-family: 'Georgia', serif; font-size: 1.2rem; resize: none; margin-bottom: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .reader-textarea:focus { outline: none; box-shadow: 0 0 0 2px rgba(252, 211, 77, 0.5); }
        .reader-textarea::placeholder { color: rgba(252, 211, 77, 0.4); }

        .reader-footer-actions { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
        
        .footer-action-btn {
            background: #4e342e; color: #fcd34d; border: 2px solid #281a16; padding: 10px 20px; border-radius: 4px; cursor: pointer;
            font-size: 1rem; display: flex; align-items: center; gap: 8px; transition: all 0.2s; font-family: 'Georgia', serif; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .footer-action-btn:hover { background: #5d4037; border-color: #fcd34d; transform: translateY(-2px); }
        
        .btn-speak { background: #2e7d32; color: white; border-color: #1b5e20; } .btn-speak:hover { background: #388e3c; }

        /* TTS Language Selector */
        .tts-selector {
            background: #fff; color: #333; border: 1px solid #ccc; padding: 5px; border-radius: 4px; font-family: sans-serif;
            font-size: 0.9rem;
        }

        /* Modal Selector de Diccionario */
        .dict-lang-modal {
            display: none;
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 350px; max-width: 90%;
            background: #451a03; 
            background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05) 2px, transparent 4px);
            border: 4px solid #281a16;
            border-radius: 8px; padding: 20px; z-index: 4000;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            color: #fcd34d;
        }
        .dict-lang-modal.active { display: block; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .dict-lang-header { text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 1.3rem; border-bottom: 1px solid #5d4037; padding-bottom: 10px; text-shadow: 1px 1px 2px black;}

        .dict-lang-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 300px; overflow-y: auto; padding-right: 5px; }
        .dict-lang-grid::-webkit-scrollbar { width: 8px; }
        .dict-lang-grid::-webkit-scrollbar-thumb { background: #5d4037; border-radius: 4px; }

        .dict-lang-btn {
            background: #5d4037; border: 2px solid #8d6e63; color: white; padding: 10px;
            border-radius: 6px; cursor: pointer; font-family: 'Georgia', serif; font-size: 0.95rem;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .dict-lang-btn:hover { background: #6d4c41; transform: scale(1.03); border-color: #fcd34d; }
        .dict-cancel { width: 100%; margin-top: 15px; background: #c62828; border-color: #b71c1c; }
        .dict-cancel:hover { background: #d32f2f; }
        
        .dict-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3999;
        }
        .dict-overlay.active { display: block; }

        @keyframes popIn { from { transform: translate(-50%, -40%) scale(0.9); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        /* Toast notification */
        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: #451a03; color: #fcd34d; border: 2px solid #fcd34d; padding: 12px 25px; border-radius: 25px;

            font-family: 'Georgia', serif; font-weight: bold;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

    </style>
</head>

        function getAuthorLastName(author) { return author.split(' ').pop(); }
        function createBug(type) {
            const bug = document.createElement('div');
            bug.classList.add('bug-target'); 
            if (type === 'butterfly') {
                const randColor = Math.random();
                let colorClass = ''; if (randColor > 0.66) colorClass = 'blue'; else if (randColor > 0.33) colorClass = 'yellow';
                bug.className = `butterfly ${colorClass}`;
                bug.innerHTML = '<div class="butterfly-wing left"></div><div class="butterfly-wing right"></div>';
            } else if (type === 'ladybug') {
                bug.className = 'ladybug-container';
                const wingUL = document.createElement('div'); wingUL.className = 'ladybug-wing-under left'; bug.appendChild(wingUL);
                const wingUR = document.createElement('div'); wingUR.className = 'ladybug-wing-under right'; bug.appendChild(wingUR);
                const head = document.createElement('div'); head.className = 'ladybug-head'; bug.appendChild(head);
                const shellL = document.createElement('div'); shellL.className = 'ladybug-shell left'; 
                const sl1 = document.createElement('div'); sl1.className = 'ladybug-spot-shell ls-1'; shellL.appendChild(sl1);
                const sl2 = document.createElement('div'); sl2.className = 'ladybug-spot-shell ls-2'; shellL.appendChild(sl2);
                bug.appendChild(shellL);
                const shellR = document.createElement('div'); shellR.className = 'ladybug-shell right'; 
                const sr1 = document.createElement('div'); sr1.className = 'ladybug-spot-shell ls-3'; shellR.appendChild(sr1);
                const sr2 = document.createElement('div'); sr2.className = 'ladybug-spot-shell ls-4'; shellR.appendChild(sr2);
                bug.appendChild(shellR);
            }
            liveBugs.push(bug);
            return bug;
        }
        function createBookElement(book) {
            const bookDiv = document.createElement('button');
            bookDiv.className = 'book';
            bookDiv.style.backgroundColor = book.color;
            bookDiv.title = `${book.title} - ${book.author}`;
            const spine = document.createElement('div'); spine.className = 'book-spine'; bookDiv.appendChild(spine);
            const texture = document.createElement('div'); texture.className = 'book-texture'; bookDiv.appendChild(texture);
            const decoration = document.createElement('div'); decoration.className = 'book-decoration';
            for (let i = 0; i < 3; i++) { const line = document.createElement('div'); line.className = 'book-line'; decoration.appendChild(line); }
            bookDiv.appendChild(decoration);
            const label = document.createElement('div'); label.className = 'book-label';
            const labelText = document.createElement('div'); labelText.className = 'book-label-text'; labelText.textContent = book.title.slice(0, 10);
            const labelAuthor = document.createElement('div'); labelAuthor.className = 'book-label-author'; labelAuthor.textContent = getAuthorLastName(book.author);
            label.appendChild(labelText); label.appendChild(labelAuthor); bookDiv.appendChild(label);
            if (book.pdfUrl && book.pdfUrl.trim() !== '' && book.pdfUrl !== 'undefined') {
                const rand = Math.random();
                if (rand > 0.85) { const bug = createBug('butterfly'); bookDiv.appendChild(bug); } 
                else if (rand > 0.7) { const bug = createBug('ladybug'); bookDiv.appendChild(bug); }
            }
            bookDiv.addEventListener('click', () => openBookModal(book));
            return bookDiv;
        }
        function createSpecialBook(title, url, color) {
            const link = document.createElement('a');
            link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer';
            link.className = 'special-book'; link.style.backgroundColor = color; link.title = title;
            const texture = document.createElement('div'); texture.className = 'special-book-texture'; link.appendChild(texture);
            const decoration = document.createElement('div'); decoration.className = 'special-book-decoration';
            for (let i = 0; i < 5; i++) { const line = document.createElement('div'); line.className = 'special-book-line'; decoration.appendChild(line); }
            link.appendChild(decoration);
            const label = document.createElement('div'); label.className = 'special-book-label'; label.textContent = title; link.appendChild(label);
            const rand = Math.random();
            if (rand > 0.6) { const bug = createBug(rand > 0.8 ? 'butterfly' : 'ladybug'); link.appendChild(bug); }
            return link;
        }
        function createBookshelf(books, isFirstShelf, alignLeft) {
            const shelfDiv = document.createElement('div'); shelfDiv.className = 'bookshelf';
            const shelfBg = document.createElement('div'); shelfBg.className = 'bookshelf-bg';
            const booksContainer = document.createElement('div'); booksContainer.className = 'books-container';
            if (alignLeft) booksContainer.classList.add('align-left'); else booksContainer.classList.add('align-right');
            if (isFirstShelf) {
                const nihongoBook = createSpecialBook('NihongoApp', 'https://kami00dragon.github.io/NihongoApp/index.html', '#8B0000');
                booksContainer.appendChild(nihongoBook);
                const aeternusBook = createSpecialBook('AeternusApp', 'https://kami00dragon.github.io/AeternusApp/', '#5D4037');
                booksContainer.appendChild(aeternusBook);
                const gramaticBook = createSpecialBook('GramaticApp', 'https://kami00dragon.github.io/gramaticapp/#posturas-teoricas', '#5D4037');
                booksContainer.appendChild(gramaticBook);
            }
            books.forEach(book => { const bookElement = createBookElement(book); booksContainer.appendChild(bookElement); });
            const shelfBoard = document.createElement('div'); shelfBoard.className = 'shelf-board';
            shelfBg.appendChild(booksContainer); shelfBg.appendChild(shelfBoard); shelfDiv.appendChild(shelfBg);
            if (Math.random() > 0.7) { const ladybug = createWalkingLadybug(); shelfBg.appendChild(ladybug); }
            return shelfDiv;
        }
        function renderLibrary() {
            const container = document.getElementById('bookshelvesContainer');
            container.innerHTML = '';
            if (filteredBooks.length === 0) {
                const noResults = document.createElement('div'); noResults.className = 'no-results';
                noResults.innerHTML = `<h2>No se encontraron libros</h2><p>Intente con otra búsqueda o desactive el filtro</p>`;
                container.appendChild(noResults); return;
            }
            liveBugs = [];
            const totalShelves = 100; 
            const baseBooksPerShelf = Math.floor(filteredBooks.length / totalShelves);
            const extraBooks = filteredBooks.length % totalShelves;
            for (let i = 0; i < totalShelves; i++) {
                const booksThisShelf = baseBooksPerShelf + (i < extraBooks ? 1 : 0);
                const startIdx = i * baseBooksPerShelf + Math.min(i, extraBooks);
                const shelfBooks = filteredBooks.slice(startIdx, startIdx + booksThisShelf);
                const shelfElement = createBookshelf(shelfBooks, i === 0, i % 2 === 0);
                container.appendChild(shelfElement);
            }
        }
        function filterBooks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const availableOnly = document.getElementById('availableFilter').checked;
            filteredBooks = allBooks.filter(book => {
                const matchesSearch = book.title.toLowerCase().includes(searchTerm) || book.author.toLowerCase().includes(searchTerm);
                const matchesAvailability = !availableOnly || book.status === 'available';
                return matchesSearch && matchesAvailability;
            });
            renderLibrary();
        }

        function toggleGoogleViewer() {
            if(!currentPdfUrl) return;
            state.isGoogleView = !state.isGoogleView;
            if(state.isGoogleView) {
                pdfIframe.src = "https://docs.google.com/gview?embedded=1&url=" + encodeURIComponent(currentPdfUrl) + "&scrollbar=0";
                btnGoogleView.classList.add('active');
            } else {
                pdfIframe.src = currentPdfUrl;
                btnGoogleView.classList.remove('active');
            }
        }

        function closeMaterialReader() {
            readerModal.classList.remove('active');
            pdfIframe.src = '';
            currentPdfUrl = '';
            ctx.clearRect(0,0,canvas.width, canvas.height);
            window.speechSynthesis.cancel();
        }

        function setTool(toolName) {
            state.tool = toolName;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if(toolName !== 'hand') document.getElementById(`tool-${toolName}`).classList.add('active');
            else document.getElementById('tool-hand').classList.add('active');
            
            if(toolName === 'pencil' || toolName === 'highlighter') settingsPanel.classList.add('show');
            else settingsPanel.classList.remove('show');

            if(toolName === 'hand') {
                readerDesk.classList.remove('mode-draw');
                readerDesk.style.overflowY = 'auto';
            } else {
                readerDesk.classList.add('mode-draw');
                readerDesk.style.overflowY = 'hidden'; 
            }
        }

        document.getElementById('tool-color').addEventListener('input', (e) => state.color = e.target.value);
        document.getElementById('tool-size').addEventListener('input', (e) => state.size = parseInt(e.target.value));

        function resizeCanvas() {
            // Ajustamos el canvas exactamente al tamaño del papel contenedor (5000px)
            canvas.width = paperContainer.offsetWidth; 
            canvas.height = paperContainer.offsetHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = state.size;
            ctx.strokeStyle = state.color;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            // Importante: Como el canvas tiene el mismo tamaño que el papel, las coordenadas son absolutas
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { 
                x: (e.clientX - rect.left) * scaleX, 
                y: (e.clientY - rect.top) * scaleY 
            };
        }

        function startDraw(e) { if(state.tool === 'hand') return; state.isDrawing = true; const pos = getPos(e); state.lastX = pos.x; state.lastY = pos.y; }
        function draw(e) {
            if(!state.isDrawing) return;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(state.lastX, state.lastY);
            ctx.lineTo(pos.x, pos.y);
            
            ctx.lineWidth = state.size;
            if(state.tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out'; 
                ctx.strokeStyle = 'rgba(0,0,0,1)'; 
                ctx.lineWidth = state.size * 5;
            } else if (state.tool === 'highlighter') {
                // Multiply funciona bien si el fondo (PDF) es blanco.
                // Si el PDF tiene fondo negro, esto lo aclararía. 
                // Asumimos fondo blanco estándar.
                ctx.globalCompositeOperation = 'multiply'; 
                ctx.strokeStyle = hexToRgba(state.color, 0.4); 
                ctx.lineWidth = state.size * 6;
            } else {
                ctx.globalCompositeOperation = 'source-over'; 
                ctx.strokeStyle = state.color; 
                ctx.lineWidth = state.size;
            }
            ctx.stroke();
            state.lastX = pos.x; state.lastY = pos.y;
        }
        function stopDraw() { state.isDrawing = false; }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseout', stopDraw);

        canvas.addEventListener('touchstart', e => { const touch=e.touches[0]; const me=new MouseEvent('mousedown',{clientX:touch.clientX,clientY:touch.clientY}); canvas.dispatchEvent(me); e.preventDefault(); }, {passive:false});
        canvas.addEventListener('touchmove', e => { const touch=e.touches[0]; const me=new MouseEvent('mousemove',{clientX:touch.clientX,clientY:touch.clientY}); canvas.dispatchEvent(me); e.preventDefault(); }, {passive:false});
        canvas.addEventListener('touchend', e => { const me=new MouseEvent('mouseup',{}); canvas.dispatchEvent(me); });

        function adjustZoom(delta) { 
            state.zoom += delta; 
            if(state.zoom < 0.5) state.zoom = 0.5; 
            if(state.zoom > 3) state.zoom = 3; 
            applyZoom(); 
        }
        function resetZoom() { state.zoom = 1; applyZoom(); }
        function applyZoom() { paperContainer.style.transform = `scale(${state.zoom})`; }

        // --- Helper: Procesador HÍBRIDO de Portapapeles ---
        async function getClipboardText() {
            // Método 1: API Moderna (Requiere HTTPS o localhost y permiso explícito)
            try {
                const text = await navigator.clipboard.readText();
                if(text && text.trim().length > 0) return text.trim();
            } catch (err) {
                console.warn("API moderna falló, intentando método clásico...", err);
            }

            // Método 2: Fallback Clásico (document.execCommand)
            // Crea un textarea temporal, pega, lee y elimina. Funciona incluso si la copia vino de un iframe.
            const hiddenInput = document.createElement("textarea");
            hiddenInput.style.position = "fixed";
            hiddenInput.style.left = "-9999px";
            document.body.appendChild(hiddenInput);
            hiddenInput.focus();
            
            // Comando de pegado
            const successful = document.execCommand('paste');
            
            const text = hiddenInput.value;
            document.body.removeChild(hiddenInput);

            if (successful && text && text.trim().length > 0) {
                return text.trim();
            }
            
            showToast("No se pudo acceder al portapapeles. Selecciona el texto, presiona Ctrl+C y pulsa el botón de nuevo.");
            return null;
        }

        async function processClipboardAction(actionType) {
            const text = await getClipboardText();
            if (!text) { return; } // Error handled in helper

            if (actionType === 'wikipedia') {
                const url = `https://es.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
            } else if (actionType === 'dict') {
                currentDictWord = text;
                document.getElementById('dictOverlay').classList.add('active');
                document.getElementById('dictModal').classList.add('active');
            } else if (actionType === 'translate') {
                const url = `https://translate.google.com/?sl=auto&tl=es&text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
            }
        }

        function closeDictionaryModal() {

        function searchDict(langCode) {
            const word = currentDictWord;
            if(!word) { 
                showToast("No hay palabra seleccionada.");
                closeDictionaryModal();
                return; 
            }
            
            let url = '';
            
            switch(langCode) {
                case 'es': url = `https://dle.rae.es/${word}`; break;
                case 'en': url = `https://www.merriam-webster.com/dictionary/${word}`; break;
                case 'jp': url = `https://jisho.org/search/${word}`; break;
                case 'zh': url = `https://www.mdbg.net/chindict/chindict.php?page=worddict&wdrst=0&wdqb=${encodeURIComponent(word)}`; break;
                case 'it': url = `https://www.treccani.it/vocabolario/${word.toLowerCase()}/`; break;
                case 'de': url = `https://www.duden.de/rechtschreibung/${word.toLowerCase()}`; break;
                case 'fr': url = `https://www.larousse.fr/dictionnaires/francais/${word.toLowerCase()}`; break;
                case 'pt': url = `https://dicio.com.br/${word.toLowerCase()}/`; break;
                case 'ru': url = `https://gramota.ru/slovari/dic?bts=${word}`; break; 
                case 'la': url = `https://www.latin-dictionary.net/search/latin/${word}`; break;
            }

            if(url) {
                window.open(url, '_blank');
                closeDictionaryModal();
            }
        }

        // --- Text-to-Speech ---
        function speakNotes() {
            const text = document.getElementById('reader-notes').value.trim();
            const langCode = document.getElementById('tts-lang').value;
            if(!text) return;
            window.speechSynthesis.cancel();

            const u = new SpeechSynthesisUtterance(text);
            
            const langMap = {
                'es': 'es-ES', 'en': 'en-US', 'it': 'it-IT', 'fr': 'fr-FR',
                'de': 'de-DE', 'pt': 'pt-BR', 'ja': 'ja-JP', 'zh': 'zh-CN'
            };
            u.lang = langMap[langCode] || 'es-ES';

            let voices = window.speechSynthesis.getVoices();
            const langVoices = voices.filter(v => v.lang.startsWith(langCode));
            
            if (langVoices.length > 0) {
                const femaleKeywords = ['Google', 'Microsoft', 'Amazon', 'Female', 'Woman', 'Zira', 'Heidi', 'Veena', 'Huihui', 'Tian Tian', 'Klara', 'Katya', 'Ayumi', 'Xiaoxiao'];
                let selectedVoice = langVoices.find(v => femaleKeywords.some(k => v.name.includes(k)));
                if (!selectedVoice) selectedVoice = langVoices.find(v => v.name.includes('Female') || v.name.includes('Woman'));
                if (!selectedVoice) selectedVoice = langVoices[0];
                if (selectedVoice) u.voice = selectedVoice;
            }

            u.rate = 1.0;
            window.speechSynthesis.speak(u);
        }
        
        window.speechSynthesis.onvoiceschanged = () => {};

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1,3), 16); const g = parseInt(hex.slice(3,5), 16); const b = parseInt(hex.slice(5,7), 16);
            return `rgba(${r},${g},${b},${alpha})`;
        }

            t.classList.add('show');

        // ==========================================
        // ANIMALES
        // ==========================================
        class BabyFox {
            constructor() {
                this.container = document.createElement('div'); this.container.className = 'baby-fox';
                this.container.innerHTML = `<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg"><path d="M40,100 Q-10,70 10,40 Q20,20 40,30 Q50,40 45,60 Z" class="fox-fur-main" /><path d="M10,40 Q20,20 40,30 Q30,25 20,35 Z" class="fox-fur-light" /><ellipse cx="110" cy="110" rx="40" ry="35" class="fox-fur-main" /><ellipse cx="110" cy="120" rx="20" ry="12" class="fox-fur-light" /><circle cx="150" cy="80" r="35" class="fox-fur-main" /><path d="M135,95 Q150,105 165,95 Q160,110 150,110 Q140,110 135,95" class="fox-fur-light" /><path d="M130,60 L115,25 L145,50 Z" class="fox-fur-main" /><path d="M170,60 L185,25 L155,50 Z" class="fox-fur-main" /><path d="M130,55 L120,35 L142,52 Z" class="fox-fur-light" /> <path d="M170,55 L180,35 L158,52 Z" class="fox-fur-light" /> <path d="M140,75 Q145,80 150,75" class="fox-eye-closed" /><path d="M150,75 Q155,80 160,75" class="fox-eye-closed" /><circle cx="150" cy="90" r="4" class="fox-nose" /></svg>`;
                document.body.appendChild(this.container);
                this.start();
            }
            start() { setTimeout(() => this.peek(), 2000); }
            peek() {
                const side = Math.random()>0.5?'right':'left';
                this.container.style.transition = 'none';
                this.container.style.transform = side==='left'?'scaleX(1)':'scaleX(-1)';
                this.container.style.left = side==='left'?'-130px':'100vw';
                this.container.style.bottom = '3rem';
                void this.container.offsetWidth;
                this.container.style.transition = 'left 0.5s ease-out';
                this.container.style.left = side==='left'?'0px':'calc(100vw - 130px)';
                setTimeout(() => { this.container.style.left = side==='left'?'-150px':'100vw'; }, 1500);
            }
        }

        class TricolorCat {
            constructor(elementId) {
                this.container = document.getElementById(elementId);
                if(!this.container) return;
                this.pawGroup = this.container.querySelector('.cat-paw');
                this.width = parseInt(getComputedStyle(this.container).width);
                this.state = 'HIDDEN';
                this.timer = null;
                this.isRunning = false;
                this.setupInteractions();
                this.start();
            }
            setupInteractions() {
                const reactToTouch = (e) => {
                    this.hideCompletely(); clearTimeout(this.timer); clearTimeout(this.peekTimer); this.scheduleNextAction();
                };
                this.container.addEventListener('click', reactToTouch);
                this.container.addEventListener('touchstart', (e) => { e.preventDefault(); reactToTouch(e); });
            }
            start() { this.scheduleNextAction(); }
            scheduleNextAction() {
                const delay = 2000 + Math.random() * 3000;
                this.timer = setTimeout(() => { this.decideAction(); }, delay);
            }
            decideAction() {
                this.container.classList.remove('is-running-anim');
                if(this.pawGroup) this.pawGroup.classList.remove('swiping');
                const rand = Math.random();
                if(rand < 0.10) { this.initiateChase(); } 
                else if(rand < 0.6) { this.runOnShelves(); } 
                else { this.peek(); }
            }
            initiateChase() {
                if(!window.foxInstance) { window.foxInstance = new BabyFox(); }
                const direction = Math.random() > 0.5 ? 'LtoR' : 'RtoL';
                const shelfBottom = this.getShelfBottomPosition();
                window.foxInstance.runAction(direction, shelfBottom, null);
                setTimeout(() => { this.runOnShelves(direction, shelfBottom); }, 400);
            }
            getShelfBottomPosition() {
                const shelves = document.querySelectorAll('.shelf-board');
                if(shelves.length === 0) return 2;
                const visibleShelves = Array.from(shelves).filter(s => { const r = s.getBoundingClientRect(); return r.top < window.innerHeight && r.bottom > 0; });
                const selectionPool = visibleShelves.length > 0 ? visibleShelves : shelves;
                const randomShelf = selectionPool[Math.floor(Math.random() * selectionPool.length)];
                return window.innerHeight - randomShelf.getBoundingClientRect().top;
            }
            runOnShelves(direction = null, bottomPos = null) {
                this.isRunning = true;
                if(!direction) { direction = Math.random() > 0.5 ? 'LtoR' : 'RtoL'; }
                if(!bottomPos) { bottomPos = this.getShelfBottomPosition(); }
                this.container.style.transition = 'none';
                if(direction === 'LtoR') {
                    this.container.style.transform = 'scaleX(1)'; this.container.classList.remove('facing-left'); this.container.classList.add('facing-right');
                    this.container.style.left = '-200px'; this.container.style.right = 'auto';
                } else {
                    this.container.style.transform = 'scaleX(-1)'; this.container.classList.remove('facing-right'); this.container.classList.add('facing-left');
                    this.container.style.left = (window.innerWidth + 200) + 'px'; this.container.style.right = 'auto';
                }
                this.container.style.bottom = `${bottomPos}px`;
                void this.container.offsetWidth;
                this.container.classList.add('is-running-anim');
                const runTime = 3500; 
                this.container.style.transition = `left ${runTime}ms linear`;
                if(direction === 'LtoR') { this.container.style.left = '100vw'; } else { this.container.style.left = '-200px'; }
                setTimeout(() => {
                    this.isRunning = false; this.container.classList.remove('is-running-anim'); this.hideCompletely(); this.scheduleNextAction();
                }, runTime);
            }
            peek() {
                this.isRunning = false;
                const side = Math.random() > 0.5 ? 'right' : 'left';
                this.container.style.transition = 'none';
                if(side === 'left') {
                    this.container.classList.remove('facing-left'); this.container.classList.add('facing-right');
                    this.container.style.left = `-${this.width}px`; this.container.style.right = 'auto'; this.container.style.bottom = `2rem`;
                } else {
                    this.container.classList.remove('facing-right'); this.container.classList.add('facing-left');
                    this.container.style.right = `-${this.width}px`; this.container.style.left = 'auto'; this.container.style.bottom = `2rem`;
                }
                void this.container.offsetHeight; 
                this.container.style.transition = 'left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                if(side === 'left') { this.container.style.left = `0px`; } else { this.container.style.right = `0px`; }
                const peekTime = 1500 + Math.random() * 2000;
                this.peekTimer = setTimeout(() => { this.hideCompletely(); this.scheduleNextAction(); }, peekTime);
            }
            hideCompletely() {
                clearTimeout(this.peekTimer);
                this.container.style.transition = 'all 0.3s ease-in';
                if(this.container.style.right !== 'auto' && this.container.style.right !== '') {
                    this.container.style.right = `-${this.width + 50}px`; setTimeout(() => { this.container.style.left = 'auto'; }, 300);
                } else {
                    this.container.style.left = `-${this.width + 50}px`; setTimeout(() => { this.container.style.right = 'auto'; }, 300);
                }
            }
            tryTouchBug() { if(this.state !== 'HIDDEN' && this.pawGroup) { this.pawGroup.classList.remove('swiping'); void this.pawGroup.offsetWidth; this.pawGroup.classList.add('swiping'); } }
        }

        BabyFox.prototype.runAction = function(direction, bottomPos, callback) {
            this.container.style.transition = 'none';
            if(direction === 'LtoR') { this.container.style.transform = 'scaleX(1)'; this.container.style.left = '-250px'; }
            else { this.container.style.transform = 'scaleX(-1)'; this.container.style.left = '100vw'; }
            this.container.style.bottom = `${bottomPos}px`; void this.container.offsetWidth;
            const duration = 3500; this.container.style.transition = `left ${duration}ms linear`;
            if(direction === 'LtoR') { this.container.style.left = '100vw'; } else { this.container.style.left = '-250px'; }
            setTimeout(() => { if(callback) callback(); }, duration);
        };

        function createWalkingLadybug() {
            const container = document.createElement('div');
            container.className = 'ladybug-walking'; container.classList.add('bug-target');
            const s1 = document.createElement('div'); s1.className = 'spot lw-s1'; container.appendChild(s1);
            const s2 = document.createElement('div'); s2.className = 'spot lw-s2'; container.appendChild(s2);
            const s3 = document.createElement('div'); s3.className = 'spot lw-s3'; container.appendChild(s3);
            const s4 = document.createElement('div'); s4.className = 'spot lw-s4'; container.appendChild(s4);
            const legs = document.createElement('div'); legs.className = 'ladybug-walking-legs'; container.appendChild(legs);
            const direction = Math.random() > 0.5 ? 1 : -1; 
            const startX = direction === 1 ? -10 : 110;
            const endX = direction === 1 ? 110 : -10;
            const duration = 10000 + Math.random() * 5000; 
            container.style.left = startX + '%'; container.style.bottom = '5px'; container.style.transform = `scaleX(${direction})`;
            liveBugs.push(container);
            const animation = container.animate([ { left: startX + '%' }, { left: endX + '%' } ], { duration: duration, iterations: Infinity, easing: 'linear' });
            return container;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentYear').innerText = new Date().getFullYear();
            renderLibrary();
            const cat1 = new TricolorCat('tricolorCat');
            const cat2 = new TricolorCat('tricolorCat2');
            setTimeout(() => cat2.start(), 2000);
            new BabyFox();
            setInterval(() => {
                const cat1Rect = document.getElementById('tricolorCat').getBoundingClientRect();
                const cat2Rect = document.getElementById('tricolorCat2').getBoundingClientRect();
                const cats = [{ rect: cat1Rect, instance: cat1 }, { rect: cat2Rect, instance: cat2 }];
                cats.forEach(catObj => {
                    if(catObj.rect.right > 0 && catObj.rect.left < window.innerWidth) {
                        liveBugs.forEach(bug => {
                            const bugRect = bug.getBoundingClientRect();
                            const dist = Math.hypot(catObj.rect.x - bugRect.x, catObj.rect.y - bugRect.y);
                            if(dist < 150) { catObj.instance.tryTouchBug(); }
                        });
                    }
                });
            }, 500);
        });
